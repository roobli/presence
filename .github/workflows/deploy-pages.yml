name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to a new image on its own schedule, and the
    # deploy is the one job that must not change under us without a commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: pages without a date in their frontmatter take their
          # modified date from git, and in a one-commit clone every file's
          # last commit is HEAD, so each deploy would restamp them in the sitemap.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Link local Quartz plugins
        run: npm run install-plugins

      - name: Build Quartz
        run: npx quartz build

      - name: Verify roob-ui mounted
        run: |
          if ! grep -Rql "tpl-width-button" public/static/scripts; then
            echo "roob-ui client script missing from build output" >&2
            ls -la .quartz/plugins || true
            ls public/static/scripts || true
            exit 1
          fi
          echo "roob-ui script present"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=presence --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
