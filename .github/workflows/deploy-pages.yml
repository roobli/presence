name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Link local Quartz plugins
        run: npm run install-plugins

      - name: Build Quartz
        run: npx quartz build

      - name: Verify roob-ui mounted
        run: |
          if ! rg -q "function roobUI|tpl-width-button" public/static/scripts/*.js; then
            echo "roob-ui client script missing from build output" >&2
            ls -la .quartz/plugins || true
            ls public/static/scripts || true
            exit 1
          fi
          echo "roob-ui script present"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=presence --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
